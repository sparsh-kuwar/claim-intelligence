# Render Blueprint: PostgreSQL + FastAPI API + React static site.
# Deploy: Render dashboard -> New -> Blueprint -> select this repo.
databases:
  - name: claims-db
    plan: free
    databaseName: claims
    user: claims

services:
  - type: web
    name: claim-intelligence-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DATABASE_URL
        fromDatabase:
          name: claims-db
          property: connectionString
      - key: AI_PROVIDER
        value: rule_based          # set to anthropic/openai and add the API key to use an LLM
      - key: CONFIDENCE_THRESHOLD
        value: "80"
      - key: SEED_SAMPLE_CLAIMS
        value: "true"
      - key: CORS_ORIGINS
        fromService:
          type: web
          name: claim-intelligence-web
          property: host

  - type: web
    name: claim-intelligence-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: claim-intelligence-api
          property: host
